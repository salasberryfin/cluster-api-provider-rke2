apiVersion: runtime.cluster.x-k8s.io/v1beta2
kind: ExtensionConfig
metadata:
  name: rke2-extension-provider
  annotations:
    # CAPI injects the CA bundle from this Secret into spec.clientConfig.caBundle
    # so CAPI core can verify the extension's TLS certificate.
    # Secret is created by cert-manager using the Certificate in certmanager/certificate.yaml.
    runtime.cluster.x-k8s.io/inject-ca-from-secret: rke2-extension-system/rke2-extension-webhook-service-cert
spec:
  clientConfig:
    service:
      name: rke2-extension-webhook-service
      namespace: rke2-extension-system
      port: 443
